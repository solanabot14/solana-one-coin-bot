# Coinbase Bot paper strategy configuration (documentation; runtime currently uses outcomeBot.js constants).
mode: paper
strategy_version: COINBASE_MAJOR_UPTREND_V5
timezone: America/Puerto_Rico
end_of_day_flat_time: "23:45"
scan_interval_seconds: 45
monitor_interval_seconds: 5
max_open_positions: 3
position_equity_fraction_min: 0.05
position_equity_fraction_max: 0.10
starting_position_usd: 10
winner_compound_rate: 0.10
max_daily_loss_fraction_of_day_start_equity: 0.03
reentry_cooldown_minutes: 60
universe:
  allowed_products: [BTC-USD, SOL-USD, XRP-USD, HYPE-USD]
  quote_currencies: [USD, USDC]
  min_24h_volume_usd: 1000000
  max_entry_spread_percent: 0.30
  max_exit_spread_percent: 0.60
momentum:
  min_24h_change_percent: -5
  max_24h_change_percent: 35
  min_1h_change_percent: 0.25
  relative_volume_15m: 1.2
  rsi_5m_max: 85
  ema_fast: 9
  ema_slow: 21
  btc_drop_pause_1h_percent: -2
entry:
  requires_price_above_vwap: true
  requires_ema9_above_ema21: true
  setup: green_pullback_reclaim_or_upward_breakout
risk:
  hard_stop_percent: 2.0
  take_profit_1_percent: 5
  take_profit_1_fraction: 0.70
  take_profit_2_percent: 20
  take_profit_2_fraction: 0.30
  time_stop_minutes: 45
  time_stop_min_gain_percent: 1.0
fees:
  paper_taker_rate_per_side: 0.006
  paper_slippage_rate_per_side: 0.001
  rate_limit_requests_per_second: 5
  max_429_retries: 3
execution_status:
  exchange_orders: false
  exchange_side_stops: false
