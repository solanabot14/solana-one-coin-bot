[broker]
paper = true
feed = "iex"
# This Alpaca paper account does not have SIP entitlement. IEX is therefore used
# consistently for both current and historical comparisons. Scanner decisions
# also require company news, relative market strength, liquidity and price action;
# IEX volume is never represented as consolidated US market volume.
allow_iex_entries = true
live_confirmation = ""
http_timeout_seconds = 10
api_attempts = 3
retry_initial_seconds = 1
retry_max_seconds = 30

[strategy]
price_min = 5.0
price_max = 250.0
average_daily_volume_min = 2000000
history_sessions = 20
minimum_history_sessions = 10
history_calendar_days = 60
scanner_top = 10
scanner_pool = 50
scanner_interval_seconds = 120
scanner_start = "07:00"
scanner_end = "09:25"
range_minutes = 5
entry_delay_minutes = 10
atr_period = 14
ema_period = 9
volume_lookback = 20
signal_volume_multiple = 1.3
rvol_min = 2.0
late_rvol_min = 2.5
late_start = "11:30"
gap_min = 0.015
gap_max = 0.12
premarket_move_min = 0.003
premarket_dollar_volume_min = 1000000
relative_strength_min = 0.0075
spread_max = 0.0015
quote_max_age_seconds = 3
bar_max_age_seconds = 90
marketable_limit_bps = 10
minimum_stop_distance = 0.02
stop_atr_multiple = 0.65
stop_buffer_atr = 0.08
retest_tolerance_atr = 0.20
max_signal_body_atr = 0.65
max_vwap_extension_atr = 0.85
max_breakout_extension_atr = 0.55
profit_r = 1.25
runner_cap_r = 4.0
trail = "ema"
time_stop_minutes = 20
flat_r = 0.25
entry_expiry_seconds = 12
halt_resume_cooldown_seconds = 300
catalyst_age_hours = 18
catalyst_terms = ["earnings", "revenue", "guidance", "beats", "raises", "approval", "fda", "contract", "acquisition", "merger", "upgrade", "results", "partnership", "launch", "order", "trial", "patent", "investment", "stake"]
seed_symbols = ["AAPL", "AMD", "NVDA", "TSLA", "F", "SOFI", "PLTR", "COIN", "HOOD", "INTC", "RIVN", "MU", "AMZN", "META", "GOOGL", "AVGO"]

[risk]
risk_fraction = 0.0035
max_positions = 3
max_trades_day = 8
max_position_equity_fraction = 0.20
max_gross_equity_fraction = 0.60
buying_power_reserve_fraction = 0.15
daily_loss_fraction = 0.015
consecutive_losses = 2
cooldown_minutes = 45
no_new_entries_minutes_before_close = 45
flatten_minutes_before_close = 15
verify_minutes_before_close = 5
allow_macro_days = false

[runtime]
state_dir = "state"
loop_seconds = 5
heartbeat_stale_seconds = 20
stream_stale_seconds = 30
stream_restart_seconds = 60
watchdog_poll_seconds = 10
bootstrap_grace_seconds = 60
shutdown_retry_seconds = 30
calendar_refresh_seconds = 3600
macro_cache_max_hours = 24
public_http_timeout_seconds = 10
public_http_user_agent = "Mozilla/5.0"
bls_url = "https://www.bls.gov/schedule/news_release/bls.ics"
fed_url = "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"

[backtest]
initial_equity = 25000.0
slippage_bps = 5.0
commission_per_share = 0.0
minimum_commission = 0.0
sell_fee_bps = 0.0
assumed_spread_bps = 10.0
participation_max = 0.01
