[broker]
paper = true
feed = "iex"
# Paper-only exploration. The bot always logs a warning; use SIP for meaningful
# consolidated-volume/RVOL measurements. Live mode rejects IEX entries in code.
allow_iex_entries = true
live_confirmation = ""
http_timeout_seconds = 10
api_attempts = 3
retry_initial_seconds = 1
retry_max_seconds = 30

[strategy]
price_min = 5.0
price_max = 150.0
average_daily_volume_min = 1000000
history_sessions = 20
minimum_history_sessions = 10
history_calendar_days = 60
scanner_top = 10
scanner_pool = 50
scanner_interval_seconds = 180
scanner_start = "08:00"
scanner_end = "09:25"
range_minutes = 5
atr_period = 14
ema_period = 9
volume_lookback = 20
signal_volume_multiple = 1.2
rvol_min = 2.0
late_rvol_min = 3.0
late_start = "11:30"
gap_min = 0.02
spread_max = 0.0015
quote_max_age_seconds = 3
bar_max_age_seconds = 90
marketable_limit_bps = 10
minimum_stop_distance = 0.02
profit_r = 1.5
runner_cap_r = 20.0
trail = "ema"
time_stop_minutes = 30
flat_r = 0.25
entry_expiry_seconds = 15
halt_resume_cooldown_seconds = 300
catalyst_age_hours = 24
catalyst_terms = ["earnings", "revenue", "guidance", "approval", "fda", "contract", "acquisition", "merger", "upgrade", "raises", "results", "partnership"]
seed_symbols = ["AAPL", "AMD", "NVDA", "TSLA", "F", "SOFI", "PLTR", "COIN", "HOOD", "INTC", "RIVN", "MU"]

[risk]
risk_fraction = 0.005
max_positions = 3
max_trades_day = 12
max_position_equity_fraction = 0.25
max_gross_equity_fraction = 0.90
buying_power_reserve_fraction = 0.10
daily_loss_fraction = 0.02
consecutive_losses = 2
cooldown_minutes = 30
no_new_entries_minutes_before_close = 30
flatten_minutes_before_close = 15
verify_minutes_before_close = 5
allow_macro_days = false

[runtime]
state_dir = "state"
loop_seconds = 5
heartbeat_stale_seconds = 20
stream_stale_seconds = 30
stream_restart_seconds = 60
watchdog_poll_seconds = 10
bootstrap_grace_seconds = 60
shutdown_retry_seconds = 30
calendar_refresh_seconds = 3600
macro_cache_max_hours = 24
public_http_timeout_seconds = 10
bls_url = "https://www.bls.gov/schedule/news_release/bls.ics"
fed_url = "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"

[backtest]
initial_equity = 25000.0
slippage_bps = 5.0
commission_per_share = 0.0
minimum_commission = 0.0
sell_fee_bps = 0.0
assumed_spread_bps = 10.0
participation_max = 0.01
